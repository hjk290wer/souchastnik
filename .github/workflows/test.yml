name: Test build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  dictionaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate dictionaries
        run: python tools/validate_dictionaries.py
      - name: Validate internet scope
        run: python tools/relevance_gate.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned llama.cpp
        shell: bash
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^PIN=//p' tools/llama-cpp-pin.txt | tail -n1)"
          test -n "$pin"
          mkdir -p third_party
          rm -rf third_party/llama.cpp
          git init third_party/llama.cpp
          git -C third_party/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C third_party/llama.cpp fetch --depth 1 origin "$pin"
          git -C third_party/llama.cpp checkout --detach "$pin"
          test -f third_party/llama.cpp/CMakeLists.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: souchastnik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
